<style>
/* fontes guardadas no próprio app: abrem sem internet e não piscam */
@font-face{font-family:Inter;font-style:normal;font-weight:400;font-display:swap;src:url(fontes/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:500;font-display:swap;src:url(fontes/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:600;font-display:swap;src:url(fontes/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:700;font-display:swap;src:url(fontes/inter-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:Inter;font-style:normal;font-weight:800;font-display:swap;src:url(fontes/inter-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:Manrope;font-style:normal;font-weight:500;font-display:swap;src:url(fontes/manrope-latin-500-normal.woff2) format("woff2")}

@font-face{font-family:Manrope;font-style:normal;font-weight:800;font-display:swap;src:url(fontes/manrope-latin-800-normal.woff2) format("woff2")}

body{margin:0;background:#F3F5F4;font-family:Inter,system-ui,sans-serif}
/* abertura: o primeiro quadro é igual à tela do sistema (fundo verde liso e o ícone grande no centro); depois o ícone encolhe, sobe e o nome aparece */
html:has(#splash){background:#0B3D2E}
#splash{position:fixed;inset:0;z-index:9000;background:#0B3D2E;overflow:hidden;transition:opacity .5s cubic-bezier(.22,1,.36,1),visibility .5s}
#splash::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#0E5640 0%,#0B3D2E 55%,#072A1F 100%);opacity:0;animation:spAparece 1s .5s ease both}
#splash .sp-c{position:absolute;left:50%;top:50%;width:0;height:0}
#splash .sp-luz{position:absolute;left:-150px;top:-184px;width:300px;height:300px;border-radius:50%;background:radial-gradient(closest-side,rgba(110,231,183,.26),rgba(110,231,183,0));opacity:0;animation:spLuz 1.2s .75s ease-out both}
#splash .sp-ic{position:absolute;left:-120px;top:-120px;width:240px;height:240px;animation:spSobe .8s .55s cubic-bezier(.65,0,.35,1) both}
#splash .sp-nm{position:absolute;left:-120px;width:240px;top:34px;text-align:center;font:800 32px/1 Manrope,Inter,system-ui,sans-serif;letter-spacing:-.035em;color:#fff;clip-path:inset(0 0 100% 0);animation:spNome .7s 1s cubic-bezier(.22,1,.36,1) both}
#splash .sp-nm span{color:#6EE7B7}
#splash .sp-bar{position:absolute;left:-22px;top:92px;width:44px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;opacity:0;animation:spAparece .5s 1.35s both}
#splash .sp-bar i{display:block;width:40%;height:100%;background:#6EE7B7;border-radius:2px;animation:spLoad 1.1s 1.4s ease-in-out infinite}
#splash.sair{opacity:0;visibility:hidden}
#splash.sair .sp-c{transform:scale(1.06);transition:transform .5s cubic-bezier(.22,1,.36,1)}
@keyframes spSobe{to{transform:translateY(-34px) scale(.35)}}
@keyframes spNome{from{clip-path:inset(0 0 100% 0);transform:translateY(14px)}to{clip-path:inset(0 0 -10% 0);transform:translateY(0)}}
@keyframes spLuz{0%{opacity:0;transform:scale(.6)}45%{opacity:1}100%{opacity:.6;transform:scale(1.1)}}
@keyframes spAparece{to{opacity:1}}
@keyframes spLoad{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-color-scheme:dark){body{background:#0A110F}}
/* esqueleto enquanto os dados aparecem */
#boot{max-width:520px;margin:0 auto;padding:76px 16px 24px}
#boot .sk{border-radius:20px;background:linear-gradient(100deg,#E6EBE8 30%,#F1F4F2 50%,#E6EBE8 70%) 0 0/300% 100%;animation:skP 1.4s ease-in-out infinite;margin-bottom:14px}
@keyframes skP{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){#boot .sk{animation:none!important}#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="sp-c"><div class="sp-luz"></div><svg class="sp-ic" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#34D399"/><g transform="translate(0 4)"><rect x="32" y="44" width="13" height="34" rx="6.5" fill="#0B3D2E"/><rect x="55" y="28" width="13" height="50" rx="6.5" fill="#0B3D2E"/><circle cx="61.5" cy="17" r="7" fill="#FFFFFF"/></g></svg><div class="sp-nm">Sa<span>ll</span>os</div><div class="sp-bar"><i></i></div></div></div>
<div id="root"><div id="boot" aria-label="Carregando Sallos"><div class="sk" style="height:22px;width:46%;border-radius:8px"></div><div class="sk" style="height:200px;background-color:#0B3D2E"></div><div class="sk" style="height:120px"></div><div class="sk" style="height:180px"></div></div></div>
<div id="error-banner" style="display:none;position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;padding:14px 16px;font-family:monospace;font-size:13px;z-index:9999;white-space:pre-wrap;max-height:60vh;overflow:auto;"></div>
<script>
  function showError(msg){var el=document.getElementById("error-banner");if(el){el.style.display="block";el.textContent="Erro ao carregar o Sallos:\n\n"+msg;}}
  window.addEventListener("error",function(e){if(e&&e.message)showError(e.message+"\n(linha "+e.lineno+")");});
</script>
<script src="app.js?v=202611281131"></script>
<script>
  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("service-worker.js").catch(function () {}); }); }
</script>
</body>
