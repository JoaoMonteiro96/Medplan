<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sallos</title>
<meta name="description" content="Gestão financeira para médicos: plantões, vínculos, despesas e investimentos." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FFFFFF" />
<link rel="apple-touch-icon" href="sallos-180.png" />
<link rel="icon" type="image/png" sizes="32x32" href="sallos-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="sallos-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sallos" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" />
<style>
body{margin:0;background:#F3F5F4;font-family:Inter,system-ui,sans-serif}
/* abertura com a marca */
#splash{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(120% 90% at 50% 0%,#0E5640 0%,#0B3D2E 55%,#072A1F 100%);transition:opacity .45s cubic-bezier(.22,1,.36,1),visibility .45s}
#splash.sair{opacity:0;visibility:hidden}
#splash .sp-ic{width:84px;height:84px;animation:spIn .7s cubic-bezier(.22,1,.36,1) both}
#splash .sp-nm{font:800 30px/1 Manrope,Inter,system-ui,sans-serif;letter-spacing:-.03em;color:#fff;animation:spUp .7s .12s cubic-bezier(.22,1,.36,1) both}
#splash .sp-nm span{color:#6EE7B7}
#splash .sp-bar{width:44px;height:3px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;animation:spUp .6s .25s both}
#splash .sp-bar i{display:block;width:40%;height:100%;background:#6EE7B7;border-radius:2px;animation:spLoad 1.1s .3s ease-in-out infinite}
@keyframes spIn{from{opacity:0;transform:scale(.7)}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}}
@keyframes spLoad{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-color-scheme:dark){body{background:#0A110F}}
/* esqueleto enquanto os dados aparecem */
#boot{max-width:520px;margin:0 auto;padding:76px 16px 24px}
#boot .sk{border-radius:20px;background:linear-gradient(100deg,#E6EBE8 30%,#F1F4F2 50%,#E6EBE8 70%) 0 0/300% 100%;animation:skP 1.4s ease-in-out infinite;margin-bottom:14px}
@keyframes skP{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){#splash *,#boot .sk{animation:none!important}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><svg class="sp-ic" viewBox="0 0 100 100"><rect width="100" height="100" rx="24" fill="#34D399"/><g transform="translate(50 50) scale(.86) translate(-50 -46)"><rect x="32" y="44" width="13" height="34" rx="6.5" fill="#0B3D2E"/><rect x="55" y="28" width="13" height="50" rx="6.5" fill="#0B3D2E"/><circle cx="61.5" cy="17" r="7" fill="#FFFFFF"/></g></svg><div class="sp-nm">Sa<span>ll</span>os</div><div class="sp-bar"><i></i></div></div>
<div id="root"><div id="boot" aria-label="Carregando Sallos"><div class="sk" style="height:22px;width:46%;border-radius:8px"></div><div class="sk" style="height:200px;background-color:#0B3D2E"></div><div class="sk" style="height:120px"></div><div class="sk" style="height:180px"></div></div></div>
<div id="error-banner" style="display:none;position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;padding:14px 16px;font-family:monospace;font-size:13px;z-index:9999;white-space:pre-wrap;max-height:60vh;overflow:auto;"></div>
<script>
  function showError(msg){var el=document.getElementById("error-banner");if(el){el.style.display="block";el.textContent="Erro ao carregar o Sallos:\n\n"+msg;}}
  window.addEventListener("error",function(e){if(e&&e.message)showError(e.message+"\n(linha "+e.lineno+")");});
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js?v=202611211915"></script>
<script>
  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("service-worker.js").catch(function () {}); }); }
</script>
</body>
</html>
