<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mediplan</title>
<meta name="description" content="Gestão financeira para médicos: plantões, vínculos, despesas e investimentos." />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#FFFFFF" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Mediplan" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<style>body{margin:0;background:#F6F7F9;font-family:Inter,system-ui,sans-serif}#boot{padding:48px 20px;text-align:center;color:#64748B}</style>
</head>
<body>
<div id="root"><div id="boot">Carregando Mediplan…</div></div>
<div id="error-banner" style="display:none;position:fixed;top:0;left:0;right:0;background:#DC2626;color:#fff;padding:14px 16px;font-family:monospace;font-size:13px;z-index:9999;white-space:pre-wrap;max-height:60vh;overflow:auto;"></div>
<script>
  function showError(msg){var el=document.getElementById("error-banner");if(el){el.style.display="block";el.textContent="Erro ao carregar o Mediplan:\n\n"+msg;}}
  window.addEventListener("error",function(e){if(e&&e.message)showError(e.message+"\n(linha "+e.lineno+")");});
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js?v=202611012103"></script>
<script>
  if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("service-worker.js").catch(function () {}); }); }
</script>
</body>
</html>
